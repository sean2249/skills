# Reusable workflow: move a `status: needs-info` issue back to `status: raw` once the author
# has answered, so issue-enhance picks it up again. No comment is posted.
# Called from each repo's .github/workflows/needs-info-reply.yml (written by issue-workflow-setup),
# on `issue_comment: created` and `issues: edited`.
#
# Comment path: the comment is on an issue (not a PR); the commenter is the repo owner or the
# issue's author, not a bot, and is a maintainer (author_association OWNER / MEMBER / COLLABORATOR);
# the comment doesn't start with "🤖 AI".
# Edit path: the editor is the repo owner, or the issue's author when that author is a maintainer;
# not a bot; the body was edited; it has a `## Pending decisions` section and every decision in it
# has at least one ticked box.
# The maintainer checks keep outside users of a public repo from moving issues around.
# The AI posts and edits with the author's login, so only markers tell them apart: AI comments
# start with "🤖 AI", and the AI writes decisions with empty boxes and never ticks one.
name: needs-info-reply

on:
  workflow_call:

permissions:
  issues: write

jobs:
  to-raw:
    # Cheap pre-filter; the step below re-checks everything.
    if: >-
      contains(github.event.issue.labels.*.name, 'status: needs-info')
    runs-on: ubuntu-latest
    steps:
      - name: Move an answered needs-info issue back to raw
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Block scalar on purpose: label names contain ": ".
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          # Same rules as skills/dev/issue-enhance/scripts/pending_decisions.py (all_ticked).
          def all_ticked(body):
              m = re.search(r"^##\s+Pending decisions\s*$", body, re.M)
              if not m:
                  return False
              rest = body[m.end():]
              n = re.search(r"^##\s+\S", rest, re.M)
              sec = rest[: n.start()] if n else rest
              heads = list(re.finditer(r"^###\s+(?:Decision|決策)\s*\d+\s*[:：]", sec, re.M))
              if not heads:
                  return False
              box = re.compile(r"^\s*[-*]\s+\[(x|X)\]\s+(A|B|C|D|Other|其他)(?=$|[\s:：(（])", re.M)
              for i, h in enumerate(heads):
                  block = sec[h.end(): heads[i + 1].start() if i + 1 < len(heads) else len(sec)]
                  if not box.search(block):
                      return False
              return True

          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = ev.get("issue", {})
          owner = ((ev.get("repository") or {}).get("owner") or {}).get("login")
          author = (issue.get("user") or {}).get("login")
          labels = [l["name"] for l in issue.get("labels", [])]
          maintainer = ("OWNER", "MEMBER", "COLLABORATOR")
          common = {
              "on an issue, not a PR": not issue.get("pull_request"),
              "issue has status: needs-info": "status: needs-info" in labels,
          }
          if "comment" in ev:
              comment = ev["comment"]
              user = comment.get("user") or {}
              checks = {**common,
                  "commenter is not a bot": user.get("type") != "Bot",
                  "commenter is owner or issue author": comment.get("author_association") == "OWNER"
                      or user.get("login") == author,
                  "commenter is a maintainer": comment.get("author_association") in maintainer,
                  "comment is not an AI comment": not (comment.get("body") or "").lstrip().startswith("🤖 AI"),
              }
          else:
              sender = ev.get("sender") or {}
              checks = {**common,
                  "issue was edited": ev.get("action") == "edited",
                  "editor is not a bot": sender.get("type") != "Bot",
                  "editor is owner or issue author": sender.get("login") in (author, owner),
                  "editor is owner, or issue author is a maintainer": sender.get("login") == owner
                      or issue.get("author_association") in maintainer,
                  "body was edited": "body" in (ev.get("changes") or {}),
                  "every pending decision has a ticked box": all_ticked(issue.get("body") or ""),
              }
          for name, ok in checks.items():
              print(f"{'ok ' if ok else 'NO '} {name}")
          if not all(checks.values()):
              print("Not switching.")
              raise SystemExit(0)
          n = str(issue["number"])
          subprocess.run(["gh", "issue", "edit", n, "--remove-label", "status: needs-info",
                          "--add-label", "status: raw"], check=True)
          print(f"Issue #{n}: status: needs-info -> status: raw")
          PY
