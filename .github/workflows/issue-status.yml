# Reusable workflow: adds `status: raw` to a new issue opened without a status label.
# Called from each repo's .github/workflows/issue-status.yml (written by setup-issue-workflow).
name: issue-status

on:
  workflow_call:

permissions:
  issues: write

jobs:
  label-raw:
    runs-on: ubuntu-latest
    steps:
      - name: Add the raw status label when no status label is present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        # Keep this a block scalar: a label like "status: raw" inline would break YAML parsing.
        run: |
          if printf '%s' "$LABELS" | grep -q '"status: '; then
            echo "Issue #$NUMBER already has a status label; nothing to do."
            exit 0
          fi
          gh issue edit "$NUMBER" --add-label "status: raw"
