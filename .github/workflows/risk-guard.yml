# Reusable workflow: fails a PR labelled `risk: low` if it changes any file that controls the
# workflow or the AI itself: anything under .github/ or .claude/, any CLAUDE.md, or the agent docs
# under docs/agents/. Whether a change is low risk is otherwise judged in the PR (the Door, and the
# security review); this check only keeps those files from ever merging as `risk: low`.
# PRs with any other risk label (or none) pass, so the caller's job can be a required status check.
# Called from each repo's .github/workflows/risk-guard.yml (written by issue-workflow-setup).
# The check shows up in the calling repo as "<caller job id> / check", i.e. "risk-guard / check".
name: risk-guard

on:
  workflow_call:
    inputs:
      allowlist:
        description: Unused since v3 (there is no allowlist any more); accepted so older callers keep working
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that low-risk PRs leave the protected files alone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          labels = json.loads(os.environ["LABELS"])
          risk = [l for l in labels if l.startswith("risk: ")]
          if len(risk) > 1:
              sys.exit(f"::error::PR has more than one risk label: {risk}")
          if risk != ["risk: low"]:
              print(f"Risk label is {risk or 'missing'}; the protected-file check does not apply.")
              sys.exit(0)

          files = subprocess.run(
              ["gh", "api", "--paginate", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/files",
               "--jq", ".[] | .filename, (.previous_filename // empty)"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()  # one path per line; paths may contain spaces
          files = [f for f in files if f]

          # Never low risk: .github/ (workflows, templates), .claude/ (permission deny rules, hooks,
          # agent docs moved there) and any CLAUDE.md (verify command, workflow keys, public-repo rules) at any
          # depth, and docs/agents/ at the repo root (what every session trusts, which label means approved).
          def protected(f):
              parts = f.split("/")
              return parts[0] == ".github" or ".claude" in parts[:-1] \
                  or parts[-1] in ("CLAUDE.md", "CLAUDE.local.md") \
                  or f.startswith("docs/agents/")
          bad = [f for f in files if protected(f)]
          if bad:
              print("::error::risk: low, but these files are never low risk:")
              for f in bad:
                  print(f"  {f}")
              sys.exit(1)
          print(f"None of the {len(files)} changed files is protected.")
          PY
