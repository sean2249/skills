# Reusable workflow: fails a PR labelled `risk: low` if any changed file is outside
# the calling repo's low-risk allowlist. PRs with any other risk label (or none) pass,
# so the caller's job can be a required status check.
# Called from each repo's .github/workflows/risk-guard.yml (written by setup-issue-workflow).
# The check shows up in the calling repo as "<caller job id> / check", i.e. "risk-guard / check".
name: risk-guard

on:
  workflow_call:
    inputs:
      allowlist:
        description: Path of the low-risk allowlist in the calling repo
        type: string
        default: .github/low-risk-paths.txt

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Checks out the CALLING repo (github.repository is the caller's) at the PR's base,
      # so the allowlist comes from the base branch and a PR cannot widen its own allowlist.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Check that low-risk PRs stay inside the allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ALLOWLIST: ${{ inputs.allowlist }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          labels = json.loads(os.environ["LABELS"])
          risk = [l for l in labels if l.startswith("risk: ")]
          if len(risk) > 1:
              sys.exit(f"::error::PR has more than one risk label: {risk}")
          if risk != ["risk: low"]:
              print(f"Risk label is {risk or 'missing'}; allowlist check does not apply.")
              sys.exit(0)

          def to_regex(glob):
              if glob.endswith("/"):
                  glob += "**"
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i):
                      out += "(?:.*/)?"; i += 3
                  elif glob.startswith("**", i):
                      out += ".*"; i += 2
                  elif glob[i] == "*":
                      out += "[^/]*"; i += 1
                  elif glob[i] == "?":
                      out += "[^/]"; i += 1
                  else:
                      out += re.escape(glob[i]); i += 1
              return re.compile(out + r"\Z")

          path = os.environ["ALLOWLIST"]
          if not os.path.exists(path):
              sys.exit(f"::error::{path} not found on the base branch; cannot verify risk: low.")
          globs = [l.strip() for l in open(path) if l.strip() and not l.lstrip().startswith("#")]
          patterns = [to_regex(g) for g in globs]

          files = subprocess.run(
              ["gh", "api", "--paginate", f"repos/{os.environ['REPO']}/pulls/{os.environ['PR']}/files",
               "--jq", ".[] | .filename, (.previous_filename // empty)"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()  # one path per line; paths may contain spaces
          files = [f for f in files if f]

          # .github/ (workflows, templates, the allowlist itself) is never low risk.
          bad = [f for f in files
                 if f.startswith(".github/") or not any(p.match(f) for p in patterns)]
          if bad:
              print("::error::risk: low, but these files are outside the low-risk allowlist:")
              for f in bad:
                  print(f"  {f}")
              sys.exit(1)
          print(f"All {len(files)} changed files are inside the low-risk allowlist.")
          PY
