# Caller for this repo's own risk-guard workflow. Written by issue-workflow-setup.
# Named self-*.yml because risk-guard.yml here is the reusable workflow itself.
# Pinned to a release tag, not ./, so a PR can't change the check that gates it.
# Required status check name: "risk-guard / check" (caller job id / reusable job id).
name: risk-guard (self)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# `gh pr create --label` fires both `opened` and `labeled`. Queue the second run behind the
# first instead of cancelling it: cancelled runs can send failure-style notification emails,
# and the run that finishes last (with the labels) is the one the check shows.
# `opened` stays in the triggers so PRs opened without any label still report the check.
concurrency:
  group: risk-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  risk-guard:
    uses: sean2249/skills/.github/workflows/risk-guard.yml@v2
