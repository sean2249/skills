<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc">
<title id="title">How the author runs the workflow</title>
<desc id="desc">The author's own way of operating the workflow. A main session picks a batch of about three raw issues, small enough to review in a day or two, and starts one child session per issue running issue-enhance. Each child writes its plan into the issue body, with decisions for the author as Pending decisions checkboxes; children never talk to each other, and GitHub issues and labels are the only handoff. The main session reports what waits: status ai-enhanced, status needs-info, and PRs. The author reviews, ticks the boxes and sets status approved, adding article-status request if the work should become an article. A new main session picks approved issues, skips blocked ones, at most one or two per repo, and starts a child session per issue running issue-implement, which opens a PR with screenshots, preview, behaviour summary and review. The author looks and merges; a GitHub Action sets article-status pending. The author runs article-request in the main session; the AI suggests a post-type with a reason and the author confirms; it opens an article card with a post-type label in the article repo (it can also start from any file). The article card goes through the same steps: issue-enhance outline, author approval, article-write in a child session, and the author merges the article.</desc>
