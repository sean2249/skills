<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="title desc">
<title id="title">How the author runs the workflow</title>
<desc id="desc">The author's own way of operating the workflow, with the issue-orchestrate skill in a main session. issue-orchestrate has four modes. enhance first triages the raw issues: a subagent proposes merging duplicates and closing ones already done, and applies the table once the author confirms it. Then enhance picks a batch of about three raw issues, small enough to review in a day or two, and starts one child session per issue running issue-enhance. status starts nothing: it reads only GitHub labels and prints a table of what waits for the author. implement picks approved issues, skips blocked ones and ones that already have an open PR, checks that their plans don't change the same files, takes at most three per repo, and starts a child session per issue running issue-implement (or post-write for an article card). article picks merged PRs labelled article-status pending and starts a child session per PR running article-request. The main session handles only what spans several issues and changes nothing on GitHub except the triage the author confirmed. Child sessions write plans into issue bodies, with decisions for the author as Pending decisions checkboxes; they never talk to each other, and GitHub issues and labels are the only handoff. Children talk as usual and the author can talk to any of them directly; the first line of each child's final message is a Report line, drawn dotted, which is only a hint for the main session. The main session reads GitHub labels, drawn solid, as the source of truth. The author reviews, ticks the boxes and sets status approved, adding article-status request if the work should become an article. The author looks at each PR and merges; a GitHub Action sets article-status pending. In the article-request child session the AI suggests a post-type with reasons and the author confirms; it opens an article card with a post-type label in the article repo. article-request can also start from any file, such as a notes page, in a session the author opens. The article card goes through the same steps: issue-enhance outline, author approval, post-write in a child session, and the author merges the article.</desc>
