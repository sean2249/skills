<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1366" width="960" height="1366" role="img" aria-labelledby="title desc">
<title id="title">Issue workflow</title>
<desc id="desc">Issue workflow: an issue starts at status: raw; /triage verifies it, grills it if needed and writes an agent brief, and the author decides in the session: needs-info (questions in a comment; the author&#x27;s reply sends it back to raw), approved with a type label, ready-for-human or wontfix, or, for big work, /to-spec and /to-tickets write a spec issue with ticket sub-issues joined by blocked-by edges. /implement builds one ticket test-first and runs code-review; /implement-spec builds a whole spec in parallel on an integration branch. issue-ship verifies, writes the PR body with the pr skill, reviews the whole PR with security-audit and code-review for up to 3 rounds with the results in the session (in round 3, a medium or high finding behind a one-way door goes back to the author), and sets the risk label from the Door and the review: risk: low merges, medium or high is merged by the author. Work cards labelled article-status: request move to pending on merge and to handoff with article-request, which opens a post-type: card in the article repo; there post-write writes an outline the author confirms in the session, then the post, which the author edits and merges.</desc>
<style>
svg{--panel:#f6f8fa;--panel-s:#d0d7de;--node:#ffffff;--node-s:#8c959f;--t:#1f2328;--s:#57606a;
--au:#fff4d6;--au-s:#d4a72c;--halo:#f2cc60;--line:#6e7781;--acc:#0969da;--art:#f6f0ff;--art-s:#8250df;--board:#eefbf1;--board-s:#4ac26b;--board-t:#1a7f37}
@media (prefers-color-scheme: dark){svg{--panel:#161b22;--panel-s:#30363d;--node:#0d1117;--node-s:#6e7681;--t:#e6edf3;--s:#9198a1;
--au:#3b2e0a;--au-s:#e3b341;--halo:#e3b341;--line:#8b949e;--acc:#4493f8;--art:#2e1f5e55;--art-s:#a371f7;--board:#0f2d1a88;--board-s:#2ea043;--board-t:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle}
.panel{fill:var(--panel);stroke:var(--panel-s);stroke-width:1.2}
.ph{text-anchor:start;font-size:17px;font-weight:700;fill:var(--t)}
.pn{fill:var(--acc)}
.zw{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:4 4}
.za{fill:var(--art);stroke:var(--art-s);stroke-width:1.2;stroke-dasharray:5 4}
.zhw{text-anchor:end;font-size:12.5px;font-weight:600;fill:var(--s)}
.zha{text-anchor:end;font-size:12.5px;font-weight:600;fill:var(--art-s)}
.node{fill:var(--node);stroke:var(--node-s);stroke-width:1.3}
.author{fill:var(--au);stroke:var(--au-s);stroke-width:2}
.halo{fill:none;stroke:var(--halo);stroke-width:3;opacity:.15;animation:pulse 3.6s ease-in-out infinite}
.t{font-size:14.5px;font-weight:600;fill:var(--t)}
.s{font-size:11.5px;fill:var(--s)}
.lbl{font-size:11.5px;fill:var(--s);text-anchor:start;font-style:italic}
.leg{font-size:13px;fill:var(--t);text-anchor:start}
.flow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-dasharray:6 5;animation:dash 2.4s linear infinite}
.ahp{fill:var(--line)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.flow,.halo{animation:none}.halo{opacity:.35}}
</style>
