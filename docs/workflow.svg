<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1130" width="960" height="1130" role="img" aria-labelledby="title desc">
<title id="title">Issue workflow</title>
<desc id="desc">Issue: author opens an issue, status raw, issue-enhance checks code and settles scope, needs-info with the decisions written into the issue body as checkboxes (once the author ticks one box per decision, it switches back to raw automatically), the plan is written and grilled by fresh reviewer subagents, negotiated with the planner, disputes go to the author as A/B decisions with checkboxes in the issue body, then status ai-enhanced and author approval. Implementation: issue-implement, pull request with evidence, code and security review (up to 3 rounds), risk label; low auto-merges, medium or high is reviewed and merged by the author. Article: a work card in a project repo labelled article-status: request is switched to article-status: pending when its PR merges (article-pending); article-request switches it to article-status: handoff and opens an article card in the article repo labelled post-type: devlog, intro, review or research (post-type exists only in the article repo; article-request can also start from any file); the article card runs the same flow, outline, Grill, approved; article-write writes it with a source map, and the author merges the article.</desc>
<style>
svg{--panel:#f6f8fa;--panel-s:#d0d7de;--node:#ffffff;--node-s:#8c959f;--t:#1f2328;--s:#57606a;
--au:#fff4d6;--au-s:#d4a72c;--halo:#f2cc60;--line:#6e7781;--grill:#eef6ff;--grill-s:#a8c7fa;--acc:#0969da;--art:#f6f0ff;--art-s:#8250df}
@media (prefers-color-scheme: dark){svg{--panel:#161b22;--panel-s:#30363d;--node:#0d1117;--node-s:#6e7681;--t:#e6edf3;--s:#9198a1;
--au:#3b2e0a;--au-s:#e3b341;--halo:#e3b341;--line:#8b949e;--grill:#0c2d6b55;--grill-s:#1f6feb;--acc:#4493f8;--art:#2e1f5e55;--art-s:#a371f7}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle}
.panel{fill:var(--panel);stroke:var(--panel-s);stroke-width:1.2}
.ph{text-anchor:start;font-size:17px;font-weight:700;fill:var(--t)}
.pn{fill:var(--acc)}
.zw{fill:none;stroke:var(--line);stroke-width:1.1;stroke-dasharray:4 4}
.za{fill:var(--art);stroke:var(--art-s);stroke-width:1.2;stroke-dasharray:5 4}
.zhw{text-anchor:end;font-size:12.5px;font-weight:600;fill:var(--s)}
.zha{text-anchor:end;font-size:12.5px;font-weight:600;fill:var(--art-s)}
.grill{fill:var(--grill);stroke:var(--grill-s);stroke-width:1.2;stroke-dasharray:5 4}
.gh{text-anchor:start;font-size:13.5px;font-weight:600;fill:var(--acc)}
.node{fill:var(--node);stroke:var(--node-s);stroke-width:1.3}
.author{fill:var(--au);stroke:var(--au-s);stroke-width:2}
.halo{fill:none;stroke:var(--halo);stroke-width:3;opacity:.15;animation:pulse 3.6s ease-in-out infinite}
.t{font-size:14.5px;font-weight:600;fill:var(--t)}
.s{font-size:11.5px;fill:var(--s)}
.lbl{font-size:11.5px;fill:var(--s);text-anchor:start;font-style:italic}
.leg{font-size:13px;fill:var(--t);text-anchor:start}
.flow{fill:none;stroke:var(--line);stroke-width:1.8;stroke-dasharray:6 5;animation:dash 2.4s linear infinite}
.ahp{fill:var(--line)}
@keyframes dash{to{stroke-dashoffset:-22}}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.flow,.halo{animation:none}.halo{opacity:.35}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="panel" x="20" y="20" width="920" height="500" rx="18"/>
<text class="ph" x="44" y="52"><tspan class="pn">1</tspan>  Issue</text>
<rect class="halo" x="32.0" y="75.0" width="216" height="70" rx="16"/>
<rect class="author" x="38.0" y="81.0" width="204" height="58" rx="11"/>
<text class="t" x="140" y="115">Author opens an issue</text>
<rect class="node" x="268.0" y="81.0" width="204" height="58" rx="11"/>
<text class="t" x="370" y="105">status: raw</text>
<text class="s" x="370" y="124">added by the issue-status Action</text>
<rect class="node" x="498.0" y="81.0" width="204" height="58" rx="11"/>
<text class="t" x="600" y="105">issue-enhance</text>
<text class="s" x="600" y="124">check code · settle scope</text>
<rect class="node" x="728.0" y="81.0" width="204" height="58" rx="11"/>
<text class="t" x="830" y="105">Write the plan</text>
<text class="s" x="830" y="124">approach · criteria · flow</text>
<path class="flow" d="M242.0 110 H264.0" marker-end="url(#ah)"/>
<path class="flow" d="M472.0 110 H494.0" marker-end="url(#ah)"/>
<path class="flow" d="M702.0 110 H724.0" marker-end="url(#ah)"/>
<rect class="node" x="498.0" y="176.0" width="204" height="58" rx="11"/>
<text class="t" x="600" y="200">status: needs-info</text>
<text class="s" x="600" y="219">decisions in the issue body</text>
<rect class="halo" x="262.0" y="170.0" width="216" height="70" rx="16"/>
<rect class="author" x="268.0" y="176.0" width="204" height="58" rx="11"/>
<text class="t" x="370" y="210">Author ticks the boxes</text>
<path class="flow" d="M600 139.0 V172.0" marker-end="url(#ah)"/>
<text class="lbl" x="608" y="161.0">missing info</text>
<path class="flow" d="M498.0 205 H476.0" marker-end="url(#ah)"/>
<path class="flow" d="M370 176.0 V143.0" marker-end="url(#ah)"/>
<text class="lbl" x="378" y="161.0">all ticked → auto back to raw</text>
<rect class="grill" x="44" y="270" width="872" height="150" rx="14"/>
<text class="gh" style="text-anchor:end" x="896" y="296">Grill · up to 3 rounds · fresh reviewers each round</text>
<rect class="node" x="65.0" y="331.0" width="250" height="58" rx="11"/>
<text class="t" x="190" y="355">Reviewer subagents</text>
<text class="s" x="190" y="374">2–4 angles · parallel · fresh context</text>
<rect class="node" x="355.0" y="331.0" width="250" height="58" rx="11"/>
<text class="t" x="480" y="355">Negotiate with the planner</text>
<text class="s" x="480" y="374">agree → change · withdraw · for author</text>
<rect class="halo" x="639.0" y="325.0" width="262" height="70" rx="16"/>
<rect class="author" x="645.0" y="331.0" width="250" height="58" rx="11"/>
<text class="t" x="770" y="355">A / B in the issue body</text>
<text class="s" x="770" y="374">author ticks a box · no recommendation</text>
<path class="flow" d="M830 139.0 V252 H190 V327.0" marker-end="url(#ah)"/>
<path class="flow" d="M315.0 360 H351.0" marker-end="url(#ah)"/>
<path class="flow" d="M605.0 360 H641.0" marker-end="url(#ah)"/>
<rect class="node" x="498.0" y="441.0" width="204" height="58" rx="11"/>
<text class="t" x="600" y="465">status: ai-enhanced</text>
<text class="s" x="600" y="484">plan + Risks + Opportunities</text>
<rect class="halo" x="722.0" y="435.0" width="216" height="70" rx="16"/>
<rect class="author" x="728.0" y="441.0" width="204" height="58" rx="11"/>
<text class="t" x="830" y="465">Author approves</text>
<text class="s" x="830" y="484">sets status: approved</text>
<path class="flow" d="M770 389.0 V420 H600 V437.0" marker-end="url(#ah)"/>
<path class="flow" d="M702.0 470 H724.0" marker-end="url(#ah)"/>
<rect class="panel" x="20" y="540" width="920" height="210" rx="18"/>
<text class="ph" x="44" y="572"><tspan class="pn">2</tspan>  Implementation</text>
<rect class="node" x="38.0" y="591.0" width="204" height="58" rx="11"/>
<text class="t" x="140" y="615">issue-implement</text>
<text class="s" x="140" y="634">new session · applies mitigations</text>
<rect class="node" x="268.0" y="591.0" width="204" height="58" rx="11"/>
<text class="t" x="370" y="615">Pull request</text>
<text class="s" x="370" y="634">evidence · behaviour summary</text>
<rect class="node" x="498.0" y="591.0" width="204" height="58" rx="11"/>
<text class="t" x="600" y="615">Review</text>
<text class="s" x="600" y="634">code + security · ≤ 3 rounds</text>
<rect class="node" x="728.0" y="591.0" width="204" height="58" rx="11"/>
<text class="t" x="830" y="615">risk label?</text>
<text class="s" x="830" y="634">unfixed security → not low</text>
<rect class="halo" x="492.0" y="670.0" width="216" height="70" rx="16"/>
<rect class="author" x="498.0" y="676.0" width="204" height="58" rx="11"/>
<text class="t" x="600" y="700">Author reviews &amp; merges</text>
<text class="s" x="600" y="719">risk: medium / high</text>
<rect class="node" x="728.0" y="676.0" width="204" height="58" rx="11"/>
<text class="t" x="830" y="700">Auto-merge</text>
<text class="s" x="830" y="719">risk: low · risk-guard / check</text>
<path class="flow" d="M830 499.0 V520 H140 V587.0" marker-end="url(#ah)"/>
<path class="flow" d="M242.0 620 H264.0" marker-end="url(#ah)"/>
<path class="flow" d="M472.0 620 H494.0" marker-end="url(#ah)"/>
<path class="flow" d="M702.0 620 H724.0" marker-end="url(#ah)"/>
<path class="flow" d="M870 649.0 V672.0" marker-end="url(#ah)"/>
<text class="lbl" x="878" y="667.0">low</text>
<path class="flow" d="M770 649.0 V663.0 H600 V672.0" marker-end="url(#ah)"/>
<text class="lbl" x="610" y="659.0">medium / high</text>
<rect class="panel" x="20" y="770" width="920" height="300" rx="18"/>
<text class="ph" x="44" y="802"><tspan class="pn">3</tspan>  Article</text>
<rect class="zw" x="38" y="814" width="444" height="242" rx="12"/>
<text class="zhw" x="470" y="836">Work card · article-status: (project repo)</text>
<rect class="za" x="494" y="814" width="444" height="242" rx="12"/>
<text class="zha" x="926" y="836">Article card · post-type: (article repo only)</text>
<rect class="node" x="38.0" y="854.0" width="204" height="88" rx="11"/>
<text class="t" x="140" y="886">article-pending</text>
<text class="s" x="140" y="904">article-status:</text>
<text class="s" x="140" y="919">request → pending · reminder</text>
<rect class="node" x="268.0" y="854.0" width="204" height="88" rx="11"/>
<text class="t" x="370" y="886">article-request</text>
<text class="s" x="370" y="904">pending → handoff</text>
<text class="s" x="370" y="919">opens a post-type: card</text>
<rect class="node" x="498.0" y="854.0" width="204" height="88" rx="11"/>
<text class="t" x="600" y="878">Article card</text>
<text class="s" x="600" y="896">post-type: devlog / intro /</text>
<text class="s" x="600" y="911">review / research</text>
<text class="s" x="600" y="926">outline → Grill → approved</text>
<rect class="node" x="728.0" y="854.0" width="204" height="88" rx="11"/>
<text class="t" x="830" y="886">article-write</text>
<text class="s" x="830" y="904">devlog · intro · review · research</text>
<text class="s" x="830" y="919">+ source map</text>
<rect class="node" x="268.0" y="983.0" width="204" height="58" rx="11"/>
<text class="t" x="370" y="1007">Any file</text>
<text class="s" x="370" y="1026">e.g. a notes page</text>
<rect class="halo" x="722.0" y="977.0" width="216" height="70" rx="16"/>
