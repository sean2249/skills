<text class="t" x="830" y="1007">Author merges the article</text>
<text class="s" x="830" y="1026">checks the source map</text>
<path class="flow" d="M830 734.0 V760 H140 V850.0" marker-end="url(#ah)"/>
<path class="flow" d="M600 734.0 V760" marker-end="url(#ah)"/>
<text class="lbl" x="154" y="788">if the work card has article-status: request</text>
<path class="flow" d="M242.0 898 H264.0" marker-end="url(#ah)"/>
<path class="flow" d="M472.0 898 H494.0" marker-end="url(#ah)"/>
