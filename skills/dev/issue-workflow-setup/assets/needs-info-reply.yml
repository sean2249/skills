# Caller for the shared needs-info-reply workflow. Written by issue-workflow-setup.
# <skills-repo> is the <owner>/<repo> that hosts the reusable workflows; <tag> is its latest release tag (v1, v2, …).
name: needs-info-reply

on:
  issue_comment:
    types: [created]
  issues:
    types: [edited]   # the author ticks the boxes of an older issue's Pending decisions

permissions:
  issues: write

jobs:
  needs-info-reply:
    uses: <skills-repo>/.github/workflows/needs-info-reply.yml@<tag>
