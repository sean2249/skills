# Caller for the shared article-pending workflow. Written by issue-workflow-setup.
# <skills-repo> is the <owner>/<repo> that hosts the reusable workflows.
name: article-pending

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  article-pending:
    uses: <skills-repo>/.github/workflows/article-pending.yml@main
